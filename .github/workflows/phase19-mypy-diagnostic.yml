name: Phase 19.1 Mypy Diagnostic

on:
  push:
    branches:
      - phase-19.1-structured-cap-persistence

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: phase-19.1-structured-cap-persistence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Capture mypy output
        shell: bash
        run: |
          mypy > phase19_mypy_report.txt 2>&1 || true
          cat phase19_mypy_report.txt

      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase19_mypy_report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture Phase 19.1 mypy diagnostics"
          git push origin HEAD:phase-19.1-structured-cap-persistence
