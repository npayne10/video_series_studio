name: Phase 19.3.7 canonical format

on:
  push:
    branches:
      - phase-19.3.7-environment-planner

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.7-environment-planner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9'
      - run: ruff format src/vscs/application/story/environment_planning.py src/vscs/presentation/widgets/governed_environment_planner.py tests/unit/test_governed_environment_planning_service.py
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vscs/application/story/environment_planning.py src/vscs/presentation/widgets/governed_environment_planner.py tests/unit/test_governed_environment_planning_service.py
          git commit -m 'Apply canonical Ruff formatting to Environment Planner'
          git push origin HEAD:phase-19.3.7-environment-planner
