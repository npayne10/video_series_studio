name: Phase 19.3.2.1 Pytest Diagnostic
on:
  push:
    branches: [phase-19.3.2.1-production-planning-workspace-consolidation]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: python -m pip install -e '.[dev]'
      - name: Capture pytest
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q > pytest-report.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-19-3-2-1-pytest-report
          path: pytest-report.txt
