name: Phase 19.3.5 Source Fix

on:
  push:
    branches: [phase-19.3.5-camera-planner]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.5-camera-planner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Correct and format Camera Planner source
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path("src/vscs/presentation/widgets/governed_camera_planner.py")
          text = ui.read_text(encoding="utf-8")
          text = text.replace("from dataclasses import dataclass\n", "from dataclasses import asdict, dataclass\nfrom enum import StrEnum\n")
          text = text.replace("def _enum_combo(enum_type: type, parent: QWidget) -> QComboBox:", "def _enum_combo(enum_type: type[StrEnum], parent: QWidget) -> QComboBox:")
          text = text.replace("**values.__dict__", "**asdict(values)")
          text = text.replace("self.ready_button.setEnabled(shot_ready and draft)", "self.ready_button.setEnabled(shot_ready and assets_ready and draft)")
          ui.write_text(text, encoding="utf-8")

          service = Path("src/vscs/application/story/camera_planning.py")
          text = service.read_text(encoding="utf-8")
          text = text.replace("    AssetResolutionRequest,\n    AssetResolutionService,", "    AssetResolutionRequest,\n    AssetResolutionResult,\n    AssetResolutionService,")
          text = text.replace("    def _profile_resolution(self, asset_id: str):", "    def _profile_resolution(self, asset_id: str) -> AssetResolutionResult:")
          service.write_text(text, encoding="utf-8")
          PY
          ruff format src/vscs/application/story/camera_planning.py src/vscs/presentation/widgets/governed_camera_planner.py tests/unit/test_governed_camera_planning_service.py tests/unit/test_governed_camera_planner_ui.py
          git rm .github/workflows/phase1935-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vscs/application/story/camera_planning.py src/vscs/presentation/widgets/governed_camera_planner.py tests/unit/test_governed_camera_planning_service.py tests/unit/test_governed_camera_planner_ui.py
          git commit -m "Normalize Phase 19.3.5 Camera Planner source"
          git push origin HEAD:phase-19.3.5-camera-planner
