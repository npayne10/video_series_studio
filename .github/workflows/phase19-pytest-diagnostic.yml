name: Phase 19.1 Pytest Diagnostic

on:
  push:
    branches:
      - phase-19.1-structured-cap-persistence

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.1-structured-cap-persistence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Capture pytest output
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --cov=vscs --cov-report=term-missing > phase19_pytest_report.txt 2>&1 || true
          tail -n 350 phase19_pytest_report.txt
      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase19_pytest_report.txt
          git commit -m "chore: capture executable Phase 19.1 pytest failures" || exit 0
          git push origin HEAD:phase-19.1-structured-cap-persistence
