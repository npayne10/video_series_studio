name: Phase 19.3.1 Lint Diagnostic
on:
  push:
    branches: [phase-19.3.1-episode-planner]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - name: Capture Ruff
        shell: bash
        run: ruff check . > ruff-report.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-19-3-1-ruff-report
          path: ruff-report.txt
