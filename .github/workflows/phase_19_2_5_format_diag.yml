name: Phase 19.2.5 Format Diagnostic
on:
  push:
    branches: [phase-19.2.5-cap-behaviour-profile-integration]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - name: Capture format diff
        shell: bash
        run: ruff format --diff . > format-report.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-19-2-5-format-report
          path: format-report.txt
