name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux media runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0 ffmpeg

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The dev extra permits newer lint/type releases. Keep CI reproducible;
      # update these together after a full Windows and Linux qualification.
      - name: Pin CI quality tools
        run: python -m pip install "ruff==0.17.6" "mypy==2.4.1"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=vscs --cov-report=term-missing
