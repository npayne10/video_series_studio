name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Format Phase 19.3.4 files
        run: |
          ruff format src/vscs/application/story/asset_resolver.py \
            src/vscs/presentation/widgets/asset_resolver_integration.py \
            src/vscs/presentation/widgets/governed_asset_resolver.py \
            tests/unit/test_governed_asset_resolver_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vscs/application/story/asset_resolver.py \
            src/vscs/presentation/widgets/asset_resolver_integration.py \
            src/vscs/presentation/widgets/governed_asset_resolver.py \
            tests/unit/test_governed_asset_resolver_ui.py
          if ! git diff --cached --quiet; then
            git commit -m "Format Phase 19.3.4 Asset Resolver"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=vscs --cov-report=term-missing
