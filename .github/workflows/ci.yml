name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check --fix src/vscs/presentation/widgets/governed_asset_resolver.py
          git diff -- src/vscs/presentation/widgets/governed_asset_resolver.py
          exit 1

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=vscs --cov-report=term-missing
