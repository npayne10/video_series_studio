name: Phase 19.3.5 Realism Fix

on:
  push:
    branches: [phase-19.3.5-camera-planner]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.5-camera-planner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Strengthen grounded focus guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/vscs/application/story/camera_planning.py")
          text = path.read_text(encoding="utf-8")
          old = 'focus_strategy = "maintain readable depth across the environment and primary subject"'
          new = 'focus_strategy = "maintain readable, physically plausible depth across the environment and primary subject"'
          if old not in text:
              raise SystemExit("Camera focus strategy anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff format src/vscs/application/story/camera_planning.py
          git rm .github/workflows/phase1935-realism-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vscs/application/story/camera_planning.py
          git commit -m "Strengthen grounded Camera Planner suggestion"
          git push origin HEAD:phase-19.3.5-camera-planner
