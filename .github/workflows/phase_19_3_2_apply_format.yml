name: Phase 19.3.2 Apply Ruff Format
on:
  push:
    branches: [phase-19.3.2-scene-planner]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.2-scene-planner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - run: ruff format .
      - run: rm -f .github/workflows/phase_19_3_2_apply_format.yml .github/workflows/phase_19_3_2_format_diag.yml
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Apply Ruff formatting for Phase 19.3.2'
          git push origin HEAD:phase-19.3.2-scene-planner
