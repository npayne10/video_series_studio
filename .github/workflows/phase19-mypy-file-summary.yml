name: Phase 19.1 Mypy File Summary

on:
  push:
    branches:
      - phase-19.1-structured-cap-persistence

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.1-structured-cap-persistence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Summarize mypy errors by file
        shell: bash
        run: |
          mypy > /tmp/mypy.txt 2>&1 || true
          grep ' error:' /tmp/mypy.txt | cut -d: -f1 | sort | uniq -c | sort -k2 > phase19_mypy_files.txt
          printf '\nTOTAL_ERRORS=' >> phase19_mypy_files.txt
          grep -c ' error:' /tmp/mypy.txt >> phase19_mypy_files.txt
          cat phase19_mypy_files.txt
      - name: Commit summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase19_mypy_files.txt
          git commit -m "chore: summarize Phase 19.1 mypy debt" || exit 0
          git push origin HEAD:phase-19.1-structured-cap-persistence
