name: Phase 19.2.2 Pytest Diagnostic

on:
  push:
    branches:
      - phase-19.2.2-behaviour-profile-persistence-repository

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Capture full pytest output
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -vv > phase-19-2-2-pytest.txt 2>&1 || true
      - name: Upload pytest output
        uses: actions/upload-artifact@v4
        with:
          name: phase-19-2-2-full-pytest-output
          path: phase-19-2-2-pytest.txt
