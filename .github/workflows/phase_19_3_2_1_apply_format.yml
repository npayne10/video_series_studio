name: Phase 19.3.2.1 Apply Ruff Format
on:
  push:
    branches: [phase-19.3.2.1-production-planning-workspace-consolidation]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.2.1-production-planning-workspace-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - run: ruff format .
      - run: rm -f .github/workflows/phase_19_3_2_1_apply_format.yml
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Apply canonical formatting for Phase 19.3.2.1'
            git push origin HEAD:phase-19.3.2.1-production-planning-workspace-consolidation
          fi
