name: Phase 19.4.2 UP038 correction

on:
  push:
    branches:
      - phase-19.4.2-action-performance-compiler
    paths:
      - .github/workflows/phase-19-4-2-up038-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.4.2-action-performance-compiler
          fetch-depth: 0

      - name: Apply exact UP038 corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/vscs/application/car/validator/behaviour.py"): [
                  ("isinstance(value, (int, float))", "isinstance(value, int | float)"),
              ],
              Path("src/vscs/application/car/validator_legacy.py"): [
                  ("isinstance(value, (int, float))", "isinstance(value, int | float)"),
                  ("isinstance(\n            environment,\n            (str, dict),\n        )", "isinstance(\n            environment,\n            str | dict,\n        )"),
              ],
              Path("src/vscs/application/story/environment_planning.py"): [
                  ("isinstance(value, (int, float, str))", "isinstance(value, int | float | str)"),
              ],
              Path("src/vscs/infrastructure/xcic/model_resolver.py"): [
                  ("isinstance(spec, (list, tuple))", "isinstance(spec, list | tuple)"),
                  ("isinstance(candidates, (list, tuple))", "isinstance(candidates, list | tuple)"),
              ],
              Path("src/vscs/infrastructure/xcic/workflow.py"): [
                  ("isinstance(value, (str, int, float, bool))", "isinstance(value, str | int | float | bool)"),
                  ("isinstance(candidate, (list, tuple))", "isinstance(candidate, list | tuple)"),
              ],
          }

          total = 0
          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one occurrence in {path}: {old!r}; found {count}")
                  text = text.replace(old, new, 1)
                  total += 1
              path.write_text(text, encoding="utf-8")

          if total != 8:
              raise SystemExit(f"Expected 8 corrections, applied {total}")
          print(f"Applied {total} exact UP038 corrections")
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/phase-19-4-2-up038-correction.yml

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vscs/application/car/validator/behaviour.py \
                  src/vscs/application/car/validator_legacy.py \
                  src/vscs/application/story/environment_planning.py \
                  src/vscs/infrastructure/xcic/model_resolver.py \
                  src/vscs/infrastructure/xcic/workflow.py \
                  .github/workflows/phase-19-4-2-up038-correction.yml
          git diff --cached --check
          git commit -m "Correct Ruff UP038 isinstance syntax"
          git push origin HEAD:phase-19.4.2-action-performance-compiler
