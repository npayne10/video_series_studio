name: Phase 19.3.2.1 Apply Mypy Fixes
on:
  push:
    branches: [phase-19.3.2.1-production-planning-workspace-consolidation]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.2.1-production-planning-workspace-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply strict typing fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/vscs/presentation/widgets/production_planning_workspace.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    if getattr(workspace, "_production_planning_consolidated", False):\n        return workspace.open_in_planner_button\n',
              '    if getattr(workspace, "_production_planning_consolidated", False):\n        existing_button = getattr(workspace, "open_in_planner_button", None)\n        if isinstance(existing_button, QPushButton):\n            return existing_button\n        raise RuntimeError("Consolidated planning workspace has no navigation button")\n',
          )
          text = text.replace(
              '        for child_index in range(layout.count()):\n            child = layout.itemAt(child_index).widget()\n            if child is workspace.refresh_button:\n',
              '        for child_index in range(layout.count()):\n            layout_item = layout.itemAt(child_index)\n            if layout_item is None:\n                continue\n            child = layout_item.widget()\n            if child is workspace.refresh_button:\n',
          )
          text = text.replace(
              '        dialog = EpisodePlannerDialog(episodes, story, workspace, scene_service=scenes)\n        _select_table_identity(dialog.table, str(data[1]))\n        dialog.exec()\n',
              '        episode_dialog = EpisodePlannerDialog(\n            episodes, story, workspace, scene_service=scenes\n        )\n        _select_table_identity(episode_dialog.table, str(data[1]))\n        episode_dialog.exec()\n',
          )
          text = text.replace(
              '        dialog = ScenePlannerDialog(scenes, episode, workspace)\n        _select_table_identity(dialog.table, str(data[1]))\n        dialog.exec()\n',
              '        scene_dialog = ScenePlannerDialog(scenes, episode, workspace)\n        _select_table_identity(scene_dialog.table, str(data[1]))\n        scene_dialog.exec()\n',
          )
          path.write_text(text, encoding='utf-8')
      - run: rm -f .github/workflows/phase_19_3_2_1_apply_mypy_fixes.yml .github/workflows/phase_19_3_2_1_mypy_diag.yml
      - name: Format and verify
        run: |
          python -m pip install ruff mypy
          ruff check . --fix
          ruff format .
      - name: Commit strict typing fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Fix strict typing in Phase 19.3.2.1 workspace'
            git push origin HEAD:phase-19.3.2.1-production-planning-workspace-consolidation
          fi
