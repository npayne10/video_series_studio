name: Phase 19.2.2 Format Diagnostic

on:
  push:
    branches:
      - phase-19.2.2-behaviour-profile-persistence-repository

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Capture Ruff formatting patch
        run: |
          ruff format .
          git diff --binary > ruff-format.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-patch
          path: ruff-format.patch
