name: Phase 19.3.7 one-shot format

on:
  push:
    branches:
      - phase-19.3.7-environment-planner

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.7-environment-planner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9'
      - name: Format Environment Planner and remove workflow
        run: |
          ruff format src/vscs/application/story/environment_planning.py
          rm .github/workflows/phase1937-one-shot-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vscs/application/story/environment_planning.py .github/workflows/phase1937-one-shot-format.yml
          git commit -m 'Apply canonical formatting to Environment Planner type fix'
          git push origin HEAD:phase-19.3.7-environment-planner
