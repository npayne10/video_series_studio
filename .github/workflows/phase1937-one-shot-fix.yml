name: Phase 19.3.7 one-shot type fix

on:
  push:
    branches:
      - phase-19.3.7-environment-planner

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.7-environment-planner
      - name: Apply typed deserialization fix and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/vscs/application/story/environment_planning.py')
          text = path.read_text(encoding='utf-8')
          old = '''    @staticmethod\n    def _optional_float(value: object) -> float | None:\n        return None if value is None else float(value)\n'''
          new = '''    @staticmethod\n    def _optional_float(value: object) -> float | None:\n        if value is None:\n            return None\n        if isinstance(value, (int, float, str)):\n            return float(value)\n        raise TypeError(f"Environment numeric value must be int, float, str or null, got {type(value).__name__}")\n'''
          if old not in text:
              raise SystemExit('Expected _optional_float implementation not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/phase1937-one-shot-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vscs/application/story/environment_planning.py .github/workflows/phase1937-one-shot-fix.yml
          git commit -m 'Fix Environment Plan numeric deserialization typing'
          git push origin HEAD:phase-19.3.7-environment-planner
