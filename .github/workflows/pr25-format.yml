name: PR25 Scoped Ruff Format

on:
  push:
    branches:
      - phase-19.1-structured-cap-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: phase-19.1-structured-cap-persistence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Format Python files changed by PR #25
        run: |
          ruff format \
            src/vscs/application/assets/xpd_preview.py \
            src/vscs/application/caie/knowledge_base.py \
            src/vscs/application/caps/__init__.py \
            src/vscs/application/caps/file_manager.py \
            src/vscs/application/caps/generator.py \
            src/vscs/application/caps/production_projection_service.py \
            src/vscs/application/caps/readiness_service.py \
            src/vscs/application/caps/repository.py \
            src/vscs/application/caps/structured_knowledge.py \
            src/vscs/bootstrap.py \
            src/vscs/domain/caps/__init__.py \
            src/vscs/domain/caps/generation.py \
            src/vscs/domain/caps/models.py \
            src/vscs/domain/caps/production_projection.py \
            src/vscs/domain/caps/structured_knowledge.py \
            src/vscs/infrastructure/ai/image_provider.py \
            src/vscs/infrastructure/ai/openai_provider.py \
            src/vscs/infrastructure/database/manager.py \
            src/vscs/infrastructure/database/models.py \
            src/vscs/infrastructure/xcic_core/runner.py \
            src/vscs/presentation/dialogs/cap_draft_review_dialog.py \
            src/vscs/presentation/widgets/cap_readiness_widget.py \
            src/vscs/presentation/widgets/cap_reference_deletion.py \
            src/vscs/presentation/widgets/cap_reference_evaluation.py \
            src/vscs/presentation/widgets/cap_structured_knowledge.py \
            tests/integration/test_structured_cap_persistence.py \
            tests/unit/test_production_projection_models.py \
            tests/unit/test_structured_cap_editor_ui.py \
            tests/unit/test_structured_cap_knowledge.py \
            tests/unit/test_structured_cap_knowledge_service.py \
            tests/unit/test_structured_cap_schema_migration.py

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/vscs/application/assets/xpd_preview.py \
            src/vscs/application/caie/knowledge_base.py \
            src/vscs/application/caps/__init__.py \
            src/vscs/application/caps/file_manager.py \
            src/vscs/application/caps/generator.py \
            src/vscs/application/caps/production_projection_service.py \
            src/vscs/application/caps/readiness_service.py \
            src/vscs/application/caps/repository.py \
            src/vscs/application/caps/structured_knowledge.py \
            src/vscs/bootstrap.py \
            src/vscs/domain/caps/__init__.py \
            src/vscs/domain/caps/generation.py \
            src/vscs/domain/caps/models.py \
            src/vscs/domain/caps/production_projection.py \
            src/vscs/domain/caps/structured_knowledge.py \
            src/vscs/infrastructure/ai/image_provider.py \
            src/vscs/infrastructure/ai/openai_provider.py \
            src/vscs/infrastructure/database/manager.py \
            src/vscs/infrastructure/database/models.py \
            src/vscs/infrastructure/xcic_core/runner.py \
            src/vscs/presentation/dialogs/cap_draft_review_dialog.py \
            src/vscs/presentation/widgets/cap_readiness_widget.py \
            src/vscs/presentation/widgets/cap_reference_deletion.py \
            src/vscs/presentation/widgets/cap_reference_evaluation.py \
            src/vscs/presentation/widgets/cap_structured_knowledge.py \
            tests/integration/test_structured_cap_persistence.py \
            tests/unit/test_production_projection_models.py \
            tests/unit/test_structured_cap_editor_ui.py \
            tests/unit/test_structured_cap_knowledge.py \
            tests/unit/test_structured_cap_knowledge_service.py \
            tests/unit/test_structured_cap_schema_migration.py
          git commit -m "style: format Phase 19.1 Python changes"
          git push origin HEAD:phase-19.1-structured-cap-persistence
