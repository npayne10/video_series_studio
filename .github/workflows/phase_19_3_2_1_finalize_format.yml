name: Phase 19.3.2.1 Finalize Format
on:
  push:
    branches: [phase-19.3.2.1-production-planning-workspace-consolidation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19.3.2.1-production-planning-workspace-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff format tests/unit/test_story_browser.py tests/unit/test_shot_planning_story_browser.py tests/unit/test_acpp_story_browser.py
      - run: rm -f .github/workflows/phase_19_3_2_1_finalize_format.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_story_browser.py tests/unit/test_shot_planning_story_browser.py tests/unit/test_acpp_story_browser.py .github/workflows/phase_19_3_2_1_finalize_format.yml
          git commit -m "Apply final Phase 19.3.2.1 test formatting"
          git push
